<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="「これ、アリかも。」で紹介したおすすめ商品をまとめています。">
  <meta name="robots" content="index,follow">
  <title>これ、アリかも。｜おすすめ商品一覧</title>
  <link rel="icon" href="assets/mascot-icon.png">
  <link rel="apple-touch-icon" href="assets/mascot-icon.png">
  <link rel="stylesheet" href="styles.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-78TPNMQE07"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-78TPNMQE07');
  </script>
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <img class="hero-banner" src="assets/hero-banner.jpg" alt="これ、アリかも。ネットで見つけたちょっといいもの、シェアします。" width="2172" height="724">
      <h1 class="sr-only">これ、アリかも。</h1>
    </div>
  </header>

  <main class="wrap">
    <aside class="notice">
      <strong>広告について</strong>
      <p>このページにはアフィリエイト広告を含みます。リンクから購入されると運営者に報酬が入る場合がありますが、購入価格は変わりません。</p>
    </aside>

    <section class="toolbar" aria-label="商品検索">
      <input id="searchInput" type="search" placeholder="商品名・カテゴリから検索" aria-label="商品を検索">
      <select id="sortSelect" aria-label="並び替え">
        <option value="default">掲載順</option>
        <option value="new">新着順</option>
        <option value="price_asc">価格が安い順</option>
      </select>
      <div id="categoryFilters" class="filters"></div>
    </section>

    <p id="resultCount" class="result-count" aria-live="polite"></p>
    <section id="productGrid" class="product-grid" aria-label="商品一覧"></section>

    <!-- 忍者AdMax: 審査・掲載確認クローラーがJSを実行しなくても検出できるよう、
         実タグは静的HTMLとして常に置いておき、JSでは表示位置を動かすだけにする。
         広告枠3は別のAdMax広告枠タグ発行後に追加 -->
    <div id="adBank" hidden>
      <div class="ad-slot" data-ad-bank="0">
        <span class="ad-label">広告</span>
        <div class="ad-body">
          <!-- admax -->
          <script src="https://adm.shinobi.jp/s/8bfd201756b0268506006df8de41251f"></script>
          <!-- admax -->
        </div>
      </div>
      <div class="ad-slot" data-ad-bank="1">
        <span class="ad-label">広告</span>
        <div class="ad-body">
          <!-- admax -->
          <script src="https://adm.shinobi.jp/s/43be1e985c03c66cc75d2550d4cebe26"></script>
          <!-- admax -->
        </div>
      </div>
      <div class="ad-slot" data-ad-bank="2">
        <span class="ad-label">広告</span>
        <div class="ad-body">
          <!-- admax -->
          <script src="https://adm.shinobi.jp/s/52abeb946e280062ecea03c6cc15135c"></script>
          <!-- admax -->
        </div>
      </div>
    </div>

    <section id="emptyState" class="empty-state" hidden>
      <img class="empty-icon" src="assets/mascot-icon.png" alt="" width="72" height="72">
      <h2>商品を準備しています</h2>
      <p>おすすめ商品を順次追加します。</p>
      <a href="https://www.instagram.com/korearikamo/" target="_blank" rel="noopener noreferrer">Instagramを見る</a>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <p>価格・在庫・キャンペーン内容は変更される場合があります。購入前に販売ページで最新情報をご確認ください。</p>
      <p>© <span id="year"></span> これ、アリかも。</p>
    </div>
  </footer>

  <script src="products.js"></script>
  <script>
    const allProducts = Array.isArray(window.PRODUCTS) ? window.PRODUCTS : [];
    const now = new Date();
    const today = [
      now.getFullYear(),
      String(now.getMonth() + 1).padStart(2, '0'),
      String(now.getDate()).padStart(2, '0')
    ].join('-');
    // 掲載終了日はその日いっぱい有効。翌日から自動的に一覧へ表示しない。
    const products = allProducts.filter(product => {
      const expiresOn = String(product.expires_on || '').trim();
      return !expiresOn || expiresOn >= today;
    });
    const grid = document.getElementById('productGrid');
    const empty = document.getElementById('emptyState');
    const input = document.getElementById('searchInput');
    const filters = document.getElementById('categoryFilters');
    const sortSelect = document.getElementById('sortSelect');
    const count = document.getElementById('resultCount');
    let selected = 'すべて';

    // 追加から3日以内の商品にNEWバッジを付ける。
    const NEW_WITHIN_DAYS = 3;
    const newCutoff = new Date(now);
    newCutoff.setDate(newCutoff.getDate() - NEW_WITHIN_DAYS);
    const newCutoffStr = [
      newCutoff.getFullYear(),
      String(newCutoff.getMonth() + 1).padStart(2, '0'),
      String(newCutoff.getDate()).padStart(2, '0')
    ].join('-');
    const isNewProduct = p => String(p.added_on || '').trim() >= newCutoffStr;

    const priceNumber = p => {
      const n = parseInt(String(p.price || '').replace(/[^0-9]/g, ''), 10);
      return Number.isNaN(n) ? Infinity : n;
    };

    // 楽天の画像URLは既定で128x128と小さく、カード表示だとぼやけるため大きいサイズを要求し直す。
    const highResImage = url => String(url || '').replace(/_ex=\d+x\d+/, '_ex=600x600');

    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const categories = ['すべて', ...new Set(products.map(p => p.category).filter(Boolean))];

    // カテゴリ名から色を自動割り当てる（同じカテゴリ名は常に同じ色になる）。
    const CATEGORY_PALETTE = [
      { fg: '#c0392b', bg: '#fdece9' },
      { fg: '#1f8a56', bg: '#e7f7ee' },
      { fg: '#2464b4', bg: '#e8f1fb' },
      { fg: '#8e3fa6', bg: '#f5ecf9' },
      { fg: '#b9860a', bg: '#fbf3dd' },
      { fg: '#c23a78', bg: '#fceaf1' },
      { fg: '#1f9a90', bg: '#e5f6f5' },
      { fg: '#c96a2e', bg: '#fbeee0' },
    ];
    function categoryColor(name) {
      const str = String(name || '');
      let hash = 0;
      for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) >>> 0;
      return CATEGORY_PALETTE[hash % CATEGORY_PALETTE.length];
    }

    // 忍者AdMax: 実タグは静的HTML（#adBank）側に置いてあるので、ここでは枠数だけ管理する。
    const AD_SLOT_TOTAL = document.querySelectorAll('#adBank .ad-slot').length;
    const adBank = document.getElementById('adBank');

    // 表示商品数に応じた理想の広告枠数（3〜5件:1枠 / 6〜8件:2枠 / 9件以上:3枠）。
    // 実際に挿入する枠数は静的に用意した枠数（AD_SLOT_TOTAL）で自動的に頭打ちにする。
    function plannedAdSlotCount(count) {
      if (count < 3) return 0;
      if (count <= 5) return 1;
      if (count <= 8) return 2;
      return 3;
    }

    // grid再描画でHTMLごと消えてしまう前に、広告ノードを保管庫（#adBank）へ戻しておく。
    function reclaimAdsToBank() {
      grid.querySelectorAll('.ad-slot[data-ad-bank]').forEach(node => adBank.appendChild(node));
    }

    // 描画済みのプレースホルダーへ、保管庫にある実タグ入りノードを移動する（複製・再生成はしない）。
    function placeAds(adsPlaced) {
      for (let i = 0; i < adsPlaced; i++) {
        const placeholder = grid.querySelector(`[data-ad-target="${i}"]`);
        const adNode = adBank.querySelector(`.ad-slot[data-ad-bank="${i}"]`);
        if (placeholder && adNode) placeholder.replaceWith(adNode);
      }
    }

    function renderFilters() {
      filters.innerHTML = categories.map(category => {
        const isAll = category === 'すべて';
        const c = isAll ? null : categoryColor(category);
        const style = c ? `style="--chip-fg:${c.fg};--chip-bg:${c.bg}"` : '';
        return `<button class="filter ${isAll ? '' : 'filter-colored'} ${selected === category ? 'active' : ''}" data-category="${esc(category)}" ${style}>${esc(category)}</button>`;
      }).join('');
    }

    function render() {
      const query = input.value.trim().toLowerCase();
      const shown = products.filter(p =>
        (selected === 'すべて' || p.category === selected) &&
        (!query || [p.name,p.category,p.description].join(' ').toLowerCase().includes(query))
      );
      empty.hidden = products.length !== 0;
      count.textContent = products.length ? `${shown.length}件の商品` : '';

      const sortMode = sortSelect.value;
      const ordered = shown.slice();
      if (sortMode === 'new') {
        ordered.sort((a, b) => String(b.added_on || '').localeCompare(String(a.added_on || '')));
      } else if (sortMode === 'price_asc') {
        ordered.sort((a, b) => priceNumber(a) - priceNumber(b));
      }

      reclaimAdsToBank();

      const slotCount = Math.min(plannedAdSlotCount(ordered.length), AD_SLOT_TOTAL);
      let adsPlaced = 0;
      const blocks = ordered.map((p, index) => {
        const c = categoryColor(p.category);
        const card = `
        <article class="card">
          ${p.image_url ? `<div class="image"><img src="${esc(highResImage(p.image_url))}" alt="" loading="lazy"></div>` : ''}
          <div class="card-body">
            <div class="badges-row">
              <span class="category" style="color:${c.fg};background:${c.bg}">${esc(p.category || 'おすすめ')}</span>
              ${isNewProduct(p) ? '<span class="new-badge">NEW</span>' : ''}
            </div>
            <h2>${esc(p.name)}</h2>
            <p>${esc(p.description)}</p>
            ${p.price ? `<div class="price">${esc(p.price)}</div>` : ''}
            <a class="button" href="${esc(p.url)}" target="_blank" rel="sponsored noopener noreferrer" data-track-shop="${esc(p.category || 'おすすめ')}" data-track-name="${esc(String(p.name || '').slice(0, 90))}">商品を見る</a>
          </div>
        </article>`;
        // 商品3件ごとに1枠、静的に用意した枠数まで挿入する。
        const isThirdInGroup = (index + 1) % 3 === 0;
        if (isThirdInGroup && adsPlaced < slotCount) {
          const placeholder = `<div class="ad-slot-target" data-ad-target="${adsPlaced}"></div>`;
          adsPlaced++;
          return card + placeholder;
        }
        return card;
      });

      grid.innerHTML = blocks.join('');
      if (products.length && !shown.length) grid.innerHTML = '<p class="no-results">該当する商品がありません。</p>';
      placeAds(adsPlaced);
    }

    filters.addEventListener('click', event => {
      const button = event.target.closest('[data-category]');
      if (!button) return;
      selected = button.dataset.category;
      renderFilters();
      render();
    });
    input.addEventListener('input', render);
    sortSelect.addEventListener('change', render);

    // 商品リンクのクリックを、商品名・ショップ別にGA4へ送信する。
    grid.addEventListener('click', event => {
      const link = event.target.closest('.button');
      if (!link || typeof gtag !== 'function') return;
      gtag('event', 'product_click', {
        shop: link.dataset.trackShop || 'おすすめ',
        item_name: link.dataset.trackName || '',
        link_url: link.href,
      });
    });
    document.getElementById('year').textContent = new Date().getFullYear();
    renderFilters();
    render();
  </script>
</body>
</html>
