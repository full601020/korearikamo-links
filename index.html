<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="「これ、アリかも。」で紹介したおすすめ商品をまとめています。">
  <meta name="robots" content="index,follow">
  <title>これ、アリかも。｜おすすめ商品一覧</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="hero">
    <div class="wrap">
      <span class="eyebrow">KORE ARI KAMO</span>
      <h1>これ、アリかも。</h1>
      <p>暮らしの中で見つけた、ちょっと気になる商品をまとめています。</p>
    </div>
  </header>

  <main class="wrap">
    <aside class="notice">
      <strong>広告について</strong>
      <p>このページにはアフィリエイト広告を含みます。リンクから購入されると運営者に報酬が入る場合がありますが、購入価格は変わりません。</p>
    </aside>

    <section class="toolbar" aria-label="商品検索">
      <input id="searchInput" type="search" placeholder="商品名・カテゴリから検索" aria-label="商品を検索">
      <div id="categoryFilters" class="filters"></div>
    </section>

    <p id="resultCount" class="result-count" aria-live="polite"></p>
    <section id="productGrid" class="product-grid" aria-label="商品一覧"></section>

    <section id="emptyState" class="empty-state" hidden>
      <div class="empty-icon">🐤</div>
      <h2>商品を準備しています</h2>
      <p>おすすめ商品を順次追加します。</p>
      <a href="https://www.instagram.com/korearikamo/" target="_blank" rel="noopener noreferrer">Instagramを見る</a>
    </section>
  </main>

  <footer>
    <div class="wrap">
      <p>価格・在庫・キャンペーン内容は変更される場合があります。購入前に販売ページで最新情報をご確認ください。</p>
      <p>© <span id="year"></span> これ、アリかも。</p>
    </div>
  </footer>

  <script src="products.js"></script>
  <script>
    const allProducts = Array.isArray(window.PRODUCTS) ? window.PRODUCTS : [];
    const now = new Date();
    const today = [
      now.getFullYear(),
      String(now.getMonth() + 1).padStart(2, '0'),
      String(now.getDate()).padStart(2, '0')
    ].join('-');
    // 掲載終了日はその日いっぱい有効。翌日から自動的に一覧へ表示しない。
    const products = allProducts.filter(product => {
      const expiresOn = String(product.expires_on || '').trim();
      return !expiresOn || expiresOn >= today;
    });
    const grid = document.getElementById('productGrid');
    const empty = document.getElementById('emptyState');
    const input = document.getElementById('searchInput');
    const filters = document.getElementById('categoryFilters');
    const count = document.getElementById('resultCount');
    let selected = 'すべて';

    const esc = value => String(value ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    const categories = ['すべて', ...new Set(products.map(p => p.category).filter(Boolean))];

    // 忍者AdMax: 発行済みの広告枠タグのみをここに追加する。
    // 同一タグを複数回貼るのは推奨されないため、未発行の枠は追加しない。
    const AD_TAGS = [
      'https://adm.shinobi.jp/s/8bfd201756b0268506006df8de41251f', // 広告枠①（320x50）
      'https://adm.shinobi.jp/s/43be1e985c03c66cc75d2550d4cebe26', // 広告枠②（320x50）
      'https://adm.shinobi.jp/s/52abeb946e280062ecea03c6cc15135c', // 広告枠③（320x50）
    ];

    // 表示商品数に応じた理想の広告枠数（3〜5件:1枠 / 6〜8件:2枠 / 9件以上:3枠）。
    // 実際に挿入する枠数は発行済みタグ数（AD_TAGS.length）で自動的に頭打ちにする。
    function plannedAdSlotCount(count) {
      if (count < 3) return 0;
      if (count <= 5) return 1;
      if (count <= 8) return 2;
      return 3;
    }

    function adSlotHtml(slotIndex) {
      return `
        <div class="ad-slot" data-ad-slot="${slotIndex}">
          <span class="ad-label">広告</span>
          <div class="ad-body" id="ad-body-${slotIndex}"></div>
        </div>`;
    }

    // innerHTML経由で挿入した<script>タグはブラウザ仕様上実行されないため、
    // 広告枠は空のコンテナとして描画し、ここで実際の<script>要素を生成して差し込む。
    function mountAds(slotCount) {
      for (let i = 0; i < slotCount; i++) {
        const body = document.getElementById(`ad-body-${i}`);
        if (!body) continue;
        const script = document.createElement('script');
        script.src = AD_TAGS[i];
        body.appendChild(script);
      }
    }

    function renderFilters() {
      filters.innerHTML = categories.map(category =>
        `<button class="filter ${selected === category ? 'active' : ''}" data-category="${esc(category)}">${esc(category)}</button>`
      ).join('');
    }

    function render() {
      const query = input.value.trim().toLowerCase();
      const shown = products.filter(p =>
        (selected === 'すべて' || p.category === selected) &&
        (!query || [p.name,p.category,p.description].join(' ').toLowerCase().includes(query))
      );
      empty.hidden = products.length !== 0;
      count.textContent = products.length ? `${shown.length}件の商品` : '';

      const slotCount = Math.min(plannedAdSlotCount(shown.length), AD_TAGS.length);
      let adsPlaced = 0;
      const blocks = shown.map((p, index) => {
        const card = `
        <article class="card">
          <div class="card-body">
            <span class="category">${esc(p.category || 'おすすめ')}</span>
            <h2>${esc(p.name)}</h2>
            <p>${esc(p.description)}</p>
            ${p.price ? `<div class="price">${esc(p.price)}</div>` : ''}
            <a class="button" href="${esc(p.url)}" target="_blank" rel="sponsored noopener noreferrer">商品を見る</a>
          </div>
        </article>`;
        // 商品3件ごとに1枠、発行済みタグ数まで挿入する。
        const isThirdInGroup = (index + 1) % 3 === 0;
        if (isThirdInGroup && adsPlaced < slotCount) {
          const ad = adSlotHtml(adsPlaced);
          adsPlaced++;
          return card + ad;
        }
        return card;
      });

      grid.innerHTML = blocks.join('');
      if (products.length && !shown.length) grid.innerHTML = '<p class="no-results">該当する商品がありません。</p>';
      if (adsPlaced) mountAds(adsPlaced);
    }

    filters.addEventListener('click', event => {
      const button = event.target.closest('[data-category]');
      if (!button) return;
      selected = button.dataset.category;
      renderFilters();
      render();
    });
    input.addEventListener('input', render);
    document.getElementById('year').textContent = new Date().getFullYear();
    renderFilters();
    render();
  </script>
</body>
</html>
